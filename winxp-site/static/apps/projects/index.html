<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .menubar {
            background: #f0f0f0;
            padding: 2px 0;
            border-bottom: 1px solid #d0d0d0;
            display: flex;
            user-select: none;
        }

        .menu-item {
            padding: 2px 6px;
            font-size: 12px;
            cursor: default;
        }

        .menu-item:hover {
            background-color: #316ac5;
            color: white;
        }

        .toolbar {
            background: #ece9d8;
            padding: 5px;
            border-bottom: 1px solid #d0d0d0;
            display: flex;
            align-items: center;
        }

        .toolbar-btn {
            display: flex;
            align-items: center;
            padding: 2px 5px;
            border: 1px solid transparent;
            cursor: pointer;
            font-size: 11px;
        }

        .toolbar-btn:hover {
            border: 1px solid #ccc;
            background: #fff;
        }

        .toolbar-btn img {
            width: 20px;
            height: 20px;
            margin-right: 5px;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 200px;
            background: #f0f0f0;
            /* XP Sidebar Blue-ish usually, but sticking to simple */
            background: linear-gradient(to bottom, #7ba2e7 0%, #6375d6 100%);
            padding: 10px;
            color: white;
            display: flex;
            flex-direction: column;
        }

        .sidebar-section {
            margin-bottom: 15px;
        }

        .sidebar-title {
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .sidebar-title img {
            width: 16px;
            height: 16px;
            margin-right: 5px;
        }

        .content-area {
            flex: 1;
            background: white;
            padding: 10px;
            overflow: auto;
        }

        .category-header {
            font-size: 12px;
            font-weight: bold;
            color: #333;
            border-bottom: 1px solid #ccc;
            margin-bottom: 10px;
            padding-bottom: 2px;
        }

        .projects-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }

        .project-item {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 5px;
            border: 1px solid transparent;
        }

        .project-item:hover {
            background-color: #e8f4ff;
            border: 1px solid #cce6ff;
        }

        .project-item.selected {
            background-color: #cce6ff;
            border: 1px solid #99ccff;
        }

        .project-item img {
            width: 48px;
            height: 48px;
            margin-bottom: 5px;
        }

        .project-item span {
            font-size: 11px;
            text-align: center;
            word-wrap: break-word;
        }

        /* Detail View */
        .project-detail {
            padding: 20px;
        }

        .detail-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .detail-header img {
            width: 64px;
            height: 64px;
            margin-right: 20px;
        }

        .detail-title {
            font-size: 24px;
            font-weight: bold;
        }

        .detail-date {
            color: #666;
            margin-top: 5px;
        }

        .detail-content {
            font-size: 14px;
            line-height: 1.5;
        }

        .back-btn {
            margin-bottom: 10px;
            cursor: pointer;
            color: blue;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="menubar">
        <div class="menu-item">File</div>
        <div class="menu-item">Edit</div>
        <div class="menu-item">View</div>
        <div class="menu-item">Favorites</div>
        <div class="menu-item">Tools</div>
        <div class="menu-item">Help</div>
    </div>
    <div class="toolbar">
        <div class="toolbar-btn" onclick="showHome()">
            <img src="../../images/icons/back.png" alt="Back"> Back
        </div>
        <div class="toolbar-btn" onclick="showHome()">
            <img src="../../images/icons/up.png" alt="Up"> Up
        </div>
        <div class="toolbar-btn">
            <img src="../../images/icons/refresh.png" alt="Search"> Search
        </div>
        <div class="toolbar-btn">
            <img src="../../images/icons/folder.png" alt="Folders"> Folders
        </div>
    </div>
    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">Project Tasks</div>
                <div style="padding-left: 20px; font-size: 11px;">
                    <div style="margin-bottom: 4px; cursor: pointer;">View project details</div>
                    <div style="margin-bottom: 4px; cursor: pointer;">Visit website</div>
                </div>
            </div>
            <div class="sidebar-section">
                <div class="sidebar-title">Other Places</div>
                <div style="padding-left: 20px; font-size: 11px;">
                    <div style="margin-bottom: 4px; cursor: pointer;">My Desktop</div>
                    <div style="margin-bottom: 4px; cursor: pointer;">My Documents</div>
                    <div style="margin-bottom: 4px; cursor: pointer;">My Computer</div>
                </div>
            </div>
        </div>
        <div class="content-area" id="content-area">
            <!-- Content injected by JS -->
        </div>
    </div>

    <script>
        const data = {
            "categories": [
                {
                    "name": "Websites",
                    "projects": [
                        {
                            "name": "Logma Production",
                            "icon": "projects/folder-logma-icon.webp",
                            "title": "Logma Production - Showcase website",
                            "date": "2023 - 2 months",
                            "description": "Showcase website for Logma Production."
                        },
                        {
                            "name": "Pangaia",
                            "icon": "projects/folder-pangaia-icon.webp",
                            "title": "Pangaia - Web Application",
                            "date": "2023 - Current",
                            "description": "Web application for Pangaia."
                        },
                        {
                            "name": "Clench",
                            "icon": "projects/folder-clench-icon.webp",
                            "title": "Clench - Web Application",
                            "date": "2024 - 1 weeks",
                            "description": "Web application for Clench."
                        },
                        {
                            "name": "EMC2 (ScreenUp)",
                            "icon": "projects/folder-emc2-icon.webp",
                            "title": "L'EMC2 - Wordpress website (ScreenUp)",
                            "date": "2024 - 1 month",
                            "description": "Wordpress website for L'EMC2."
                        },
                        {
                            "name": "Aidella",
                            "icon": "projects/folder-aidella-icon.webp",
                            "title": "Les Terres d'Aidella - Blog website",
                            "date": "2025 - 3 weeks",
                            "description": "Blog website for Les Terres d'Aidella."
                        },
                        {
                            "name": "Portfolio Fanny",
                            "icon": "projects/folder-fanny-icon.webp",
                            "title": "Fanny Séraudie - Portfolio website",
                            "date": "2025 - 2 weeks",
                            "description": "Portfolio website for Fanny Séraudie."
                        }
                    ]
                },
                {
                    "name": "Servers",
                    "projects": [
                        {
                            "name": "Homeserver",
                            "icon": "projects/homeserver-icon.webp",
                            "title": "Application server & NAS",
                            "date": "2023 - Current",
                            "description": "Home application server and NAS setup."
                        }
                    ]
                }
            ]
        };

        const contentArea = document.getElementById('content-area');

        function showHome() {
            let html = '';
            data.categories.forEach(cat => {
                html += `
                    <div class="category-header">${cat.name}</div>
                    <div class="projects-grid">
                `;
                cat.projects.forEach((proj, index) => {
                    // Store category index and project index to identify it
                    const catIndex = data.categories.indexOf(cat);
                    html += `
                        <div class="project-item" onclick="showProject(${catIndex}, ${index})">
                            <img src="../../images/icons/${proj.icon}" alt="${proj.name}">
                            <span>${proj.name}</span>
                        </div>
                    `;
                });
                html += `</div><br>`;
            });
            contentArea.innerHTML = html;
        }

        function showProject(catIndex, projIndex) {
            const project = data.categories[catIndex].projects[projIndex];
            contentArea.innerHTML = `
                <div class="project-detail">
                    <div class="back-btn" onclick="showHome()">&lt; Back to Projects</div>
                    <div class="detail-header">
                        <img src="../../images/icons/${project.icon}" alt="${project.name}">
                        <div>
                            <div class="detail-title">${project.title}</div>
                            <div class="detail-date">${project.date}</div>
                        </div>
                    </div>
                    <div class="detail-content">
                        <p>${project.description}</p>
                        <p><em>(Full project details would be loaded here)</em></p>
                    </div>
                </div>
            `;
        }

        // Initialize
        showHome();
    </script>
</body>

</html>
