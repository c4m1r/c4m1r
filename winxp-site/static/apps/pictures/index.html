<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Pictures</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tahoma', sans-serif;
            background: white;
            overflow: hidden;
        }

        .toolbar {
            background: linear-gradient(to bottom, #ece9d8 0%, #d6d3ce 100%);
            padding: 5px;
            border-bottom: 1px solid #919b9c;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .toolbar h2 {
            font-size: 14px;
            color: #000080;
            font-weight: normal;
        }

        .folder-tabs {
            display: flex;
            background: #ece9d8;
            border-bottom: 2px solid #919b9c;
            padding: 5px 10px;
        }

        .folder-tab {
            padding: 5px 15px;
            cursor: pointer;
            border: 1px solid transparent;
            border-radius: 3px 3px 0 0;
            font-size: 11px;
            margin-right: 2px;
        }

        .folder-tab:hover {
            background: #fff;
        }

        .folder-tab.active {
            background: #fff;
            border-color: #919b9c;
            border-bottom-color: #fff;
            font-weight: bold;
        }

        .pictures-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            padding: 20px;
            height: calc(100vh - 100px);
            overflow-y: auto;
            background: #fff;
        }

        .picture-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            padding: 5px;
            border: 1px solid transparent;
        }

        .picture-item:hover {
            background: #316AC5;
            border-color: #5a9ef7;
        }

        .picture-item:hover .picture-name {
            color: white;
        }

        .picture-thumbnail {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 1px solid #ccc;
            background: #f0f0f0;
        }

        .picture-name {
            margin-top: 5px;
            font-size: 11px;
            text-align: center;
            word-break: break-word;
            max-width: 110px;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 14px;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #999;
            font-size: 12px;
        }

        /* Scrollbar styling for Windows XP */
        .pictures-container::-webkit-scrollbar {
            width: 16px;
        }

        .pictures-container::-webkit-scrollbar-track {
            background: #ece9d8;
        }

        .pictures-container::-webkit-scrollbar-thumb {
            background: linear-gradient(to right, #b8cfe5 0%, #8faec4 100%);
            border: 1px solid #5a7899;
        }

        .pictures-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(to right, #a0c8e8 0%, #7a9ab8 100%);
        }
    </style>
</head>

<body>
    <div class="toolbar">
        <h2>My Pictures</h2>
    </div>

    <div class="folder-tabs">
        <div class="folder-tab active" data-folder="wallpapers">Wallpapers</div>
        <div class="folder-tab" data-folder="photos">Photos</div>
    </div>

    <div class="pictures-container" id="pictures-container">
        <div class="loading">Loading pictures...</div>
    </div>

    <script>
        const picturesContainer = document.getElementById('pictures-container');
        const folderTabs = document.querySelectorAll('.folder-tab');
        let currentFolder = 'wallpapers';

        // Image folders
        const imageFolders = {
            wallpapers: '/images/wallpapers/',
            photos: '/images/photos/'
        };

        // Common image extensions
        const imageExtensions = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'];

        // Known images (you can expand this list or make it dynamic via API)
        const knownImages = {
            wallpapers: [
                'bliss.jpg',
                'bg.jpg'
            ],
            photos: []  // Will be populated if photos are added
        };

        // Function to load pictures from a folder
        async function loadPictures(folder) {
            picturesContainer.innerHTML = '<div class="loading">Loading pictures...</div>';

            try {
                const folderPath = imageFolders[folder];
                const images = knownImages[folder];

                if (images.length === 0) {
                    picturesContainer.innerHTML = '<div class="empty-state">No pictures found in this folder.<br>Add images to /static/images/' + folder + '</div>';
                    return;
                }

                picturesContainer.innerHTML = '';

                images.forEach(imageName => {
                    const pictureItem = document.createElement('div');
                    pictureItem.className = 'picture-item';

                    const img = document.createElement('img');
                    img.className = 'picture-thumbnail';
                    img.src = folderPath + imageName;
                    img.alt = imageName;
                    img.onerror = function () {
                        this.src = '/images/empty.png';
                    };

                    const name = document.createElement('div');
                    name.className = 'picture-name';
                    name.textContent = imageName;

                    pictureItem.appendChild(img);
                    pictureItem.appendChild(name);

                    // Click to view full size
                    pictureItem.addEventListener('click', () => {
                        window.open(folderPath + imageName, '_blank');
                    });

                    picturesContainer.appendChild(pictureItem);
                });
            } catch (error) {
                console.error('Error loading pictures:', error);
                picturesContainer.innerHTML = '<div class="empty-state">Error loading pictures</div>';
            }
        }

        // Tab switching
        folderTabs.forEach(tab => {
            tab.addEventListener('click', () => {
                folderTabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentFolder = tab.dataset.folder;
                loadPictures(currentFolder);
            });
        });

        // Initial load
        loadPictures(currentFolder);

        // Auto-discover images from folders (advanced feature - requires server support)
        // You can enhance this by creating an API endpoint that lists files in the folders
        async function discoverImages(folder) {
            try {
                // This would require a server endpoint like /api/list-images?folder=wallpapers
                const response = await fetch(`/api/list-images?folder=${folder}`);
                if (response.ok) {
                    const data = await response.json();
                    knownImages[folder] = data.images || [];
                }
            } catch (error) {
                // Fallback to known images if API not available
                console.log('Using predefined image list');
            }
        }
    </script>
</body>

</html>
