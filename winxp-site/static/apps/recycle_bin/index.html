<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recycle Bin</title>
    <link rel="stylesheet" href="../../css/os.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            font-family: 'Tahoma', sans-serif;
            font-size: 11px;
            overflow: hidden;
        }

        .recycle-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .toolbar {
            background: linear-gradient(to bottom, #f3f3f3, #e8e8e8);
            border-bottom: 1px solid #c0c0c0;
            padding: 5px;
            display: flex;
            gap: 5px;
        }

        .toolbar-btn {
            background: #f0f0f0;
            border: 1px outset #fff;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 11px;
        }

        .toolbar-btn:hover {
            background: #e0e0e0;
        }

        .toolbar-btn:active {
            border-style: inset;
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .empty-message {
            text-align: center;
            padding: 50px;
            color: #666;
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            opacity: 0.5;
        }

        .item-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .item {
            display: flex;
            align-items: center;
            padding: 5px;
            border-radius: 2px;
            cursor: pointer;
        }

        .item:hover {
            background: #e0e0e0;
        }

        .item.selected {
            background: #0055ea;
            color: white;
        }

        .item-icon {
            width: 32px;
            height: 32px;
            margin-right: 10px;
        }
    </style>
</head>

<body>
    <div class="recycle-container">
        <div class="toolbar">
            <button class="toolbar-btn" onclick="emptyRecycleBin()">Empty Recycle Bin</button>
            <button class="toolbar-btn" onclick="restoreItems()">Restore</button>
        </div>
        <div class="content" id="content">
            <div class="empty-message">
                <svg class="empty-icon" viewBox="0 0 64 64" fill="currentColor">
                    <path d="M32 8 L24 16 L16 16 L16 56 L48 56 L48 16 L40 16 Z M28 20 L36 20 L36 48 L28 48 Z" />
                </svg>
                <h3>Recycle Bin is empty</h3>
                <p>When you delete files or folders, they will appear here.</p>
            </div>
        </div>
    </div>

    <script>
        // Mock deleted items (in a real implementation, this would be stored)
        let deletedItems = [];

        function renderItems() {
            const content = document.getElementById('content');

            if (deletedItems.length === 0) {
                content.innerHTML = `
                    <div class="empty-message">
                        <svg class="empty-icon" viewBox="0 0 64 64" fill="currentColor">
                            <path d="M32 8 L24 16 L16 16 L16 56 L48 56 L48 16 L40 16 Z M28 20 L36 20 L36 48 L28 48 Z"/>
                        </svg>
                        <h3>Recycle Bin is empty</h3>
                        <p>When you delete files or folders, they will appear here.</p>
                    </div>
                `;
            } else {
                content.innerHTML = `
                    <div class="item-list">
                        ${deletedItems.map((item, index) => `
                            <div class="item" onclick="selectItem(${index})">
                                <img src="../../images/icons/file.png" class="item-icon" alt="${item.name}">
                                <div>
                                    <div>${item.name}</div>
                                    <div style="font-size: 10px; color: #666;">Deleted: ${item.deletedDate}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }

        function selectItem(index) {
            const items = document.querySelectorAll('.item');
            items.forEach((item, i) => {
                item.classList.toggle('selected', i === index);
            });
        }

        function emptyRecycleBin() {
            if (deletedItems.length === 0) {
                alert('Recycle Bin is already empty.');
                return;
            }

            if (confirm('Are you sure you want to permanently delete all items?')) {
                deletedItems = [];
                renderItems();
                alert('Recycle Bin has been emptied.');
            }
        }

        function restoreItems() {
            const selected = document.querySelector('.item.selected');
            if (!selected) {
                alert('Please select an item to restore.');
                return;
            }

            alert('Item restored successfully.');
            // In real implementation, would restore the file
        }

        // Initial render
        renderItems();
    </script>
</body>

</html>
