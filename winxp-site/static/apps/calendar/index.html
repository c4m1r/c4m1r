<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <link rel="stylesheet" href="../../css/os.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: white;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', sans-serif;
            overflow-y: auto;
        }

        .calendar-container {
            padding: 10px;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .calendar-header h2 {
            margin: 0;
            font-size: 16px;
            text-transform: capitalize;
        }

        .nav-btn {
            background: #f0f0f0;
            border: 1px solid #a0a0a0;
            padding: 5px 15px;
            cursor: pointer;
            font-weight: bold;
            color: #0055ea;
            text-decoration: underline;
        }

        .nav-btn:hover {
            background: #e0e0e0;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background-color: #ccc;
            border: 1px solid #ccc;
        }

        .calendar-day {
            background: white;
            min-height: 80px;
            padding: 5px;
            position: relative;
        }

        .calendar-day.today {
            background-color: #fffacd;
            border: 2px solid #ffd700;
        }

        .day-number {
            font-weight: bold;
            font-size: 12px;
            margin-bottom: 3px;
        }

        .event {
            background: #000;
            color: white;
            font-size: 10px;
            padding: 2px 4px;
            margin: 2px 0;
            border-radius: 2px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .event-location {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 9px;
            margin-top: 1px;
            color: #666;
        }

        .event-location svg {
            width: 10px;
            height: 10px;
            flex-shrink: 0;
        }
    </style>
</head>

<body>
    <div class="calendar-container">
        <div class="calendar-header">
            <button class="nav-btn" onclick="previousMonth()">&lt;</button>
            <h2 id="month-year"></h2>
            <button class="nav-btn" onclick="nextMonth()">&gt;</button>
        </div>
        <div class="calendar-grid" id="calendar-grid">
            <!-- Calendar days will be injected here -->
        </div>
    </div>

    <script>
        // Mock events data
        const events = [
            {
                date: new Date(2025, 10, 25), // November 25, 2025
                summary: "Project Deadline",
                location: "Office"
            },
            {
                date: new Date(2025, 10, 28),
                summary: "Team Meeting",
                location: "Conference Room A"
            },
            {
                date: new Date(2025, 11, 1), // December 1, 2025
                summary: "Client Presentation",
                location: "Client Office"
            },
            {
                date: new Date(2025, 11, 15),
                summary: "Holiday Party",
                location: "Main Hall"
            },
            {
                date: new Date(2025, 11, 25),
                summary: "Christmas",
                location: "Home"
            }
        ];

        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();

        function renderCalendar() {
            const monthYearEl = document.getElementById('month-year');
            const calendarGrid = document.getElementById('calendar-grid');

            // Set month/year header
            const monthName = new Date(currentYear, currentMonth).toLocaleString('default', { month: 'long' });
            monthYearEl.textContent = `${monthName} ${currentYear}`;

            // Clear grid
            calendarGrid.innerHTML = '';

            // Get first day of month and number of days
            const firstDay = new Date(currentYear, currentMonth, 1).getDay();
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

            // Get today's date for highlighting
            const today = new Date();
            const isCurrentMonth = today.getMonth() === currentMonth && today.getFullYear() === currentYear;
            const todayDate = today.getDate();

            // Render days
            for (let i = 0; i < firstDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'calendar-day';
                calendarGrid.appendChild(emptyDay);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day';

                // Highlight today
                if (isCurrentMonth && day === todayDate) {
                    dayEl.classList.add('today');
                }

                // Day number
                const dayNumber = document.createElement('div');
                dayNumber.className = 'day-number';
                dayNumber.textContent = day;
                dayEl.appendChild(dayNumber);

                // Find events for this day
                const dayEvents = events.filter(event => {
                    return event.date.getFullYear() === currentYear &&
                        event.date.getMonth() === currentMonth &&
                        event.date.getDate() === day;
                });

                // Render events
                dayEvents.forEach(event => {
                    const eventEl = document.createElement('div');
                    eventEl.className = 'event';
                    eventEl.textContent = event.summary;
                    eventEl.title = `${event.summary} - ${event.location}`;
                    dayEl.appendChild(eventEl);

                    if (event.location) {
                        const locationEl = document.createElement('div');
                        locationEl.className = 'event-location';
                        locationEl.innerHTML = `
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                                <path fill="#666" d="M12 12q.825 0 1.413-.587T14 10t-.587-1.412T12 8t-1.412.588T10 10t.588 1.413T12 12m0 7.35q3.05-2.8 4.525-5.087T18 10.2q0-2.725-1.737-4.462T12 4T7.738 5.738T6 10.2q0 1.775 1.475 4.063T12 19.35M12 22q-4.025-3.425-6.012-6.362T4 10.2q0-3.75 2.413-5.975T12 2t5.588 2.225T20 10.2q0 2.5-1.987 5.438T12 22m0-12"/>
                            </svg>
                            <span>${event.location}</span>
                        `;
                        dayEl.appendChild(locationEl);
                    }
                });

                calendarGrid.appendChild(dayEl);
            }
        }

        function previousMonth() {
            if (currentMonth === 0) {
                currentMonth = 11;
                currentYear--;
            } else {
                currentMonth--;
            }
            renderCalendar();
        }

        function nextMonth() {
            if (currentMonth === 11) {
                currentMonth = 0;
                currentYear++;
            } else {
                currentMonth++;
            }
            renderCalendar();
        }

        // Initial render
        renderCalendar();
    </script>
</body>

</html>
