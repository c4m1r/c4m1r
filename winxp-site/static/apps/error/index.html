<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #c0c0c0;
            font-family: 'Tahoma', 'MS Sans Serif', sans-serif;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .error-dialog {
            background: #c0c0c0;
            border: 2px outset #fff;
            box-shadow: 2px 2px 0 #000;
            width: 400px;
            padding: 0;
        }

        .title-bar {
            background: linear-gradient(to right, #000080, #1084d0);
            color: white;
            padding: 3px 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .title-bar-text {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .title-icon {
            width: 16px;
            height: 16px;
        }

        .close-btn {
            background: #c0c0c0;
            border: 1px outset #fff;
            width: 16px;
            height: 14px;
            font-size: 10px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }

        .close-btn:active {
            border-style: inset;
        }

        .dialog-content {
            padding: 20px;
            display: flex;
            gap: 15px;
            align-items: flex-start;
        }

        .error-icon {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        .error-message {
            flex: 1;
            line-height: 1.4;
        }

        .button-container {
            padding: 0 20px 20px;
            text-align: center;
        }

        .ok-button {
            background: #c0c0c0;
            border: 2px outset #fff;
            padding: 4px 20px;
            font-family: inherit;
            font-size: 11px;
            cursor: pointer;
            min-width: 75px;
        }

        .ok-button:active {
            border-style: inset;
        }

        .ok-button:focus {
            outline: 1px dotted #000;
            outline-offset: -4px;
        }
    </style>
</head>

<body>
    <div class="error-dialog">
        <div class="title-bar">
            <div class="title-bar-text">
                <svg class="title-icon" viewBox="0 0 16 16" fill="currentColor">
                    <circle cx="8" cy="8" r="7" fill="#fff" />
                    <path d="M8 3 L8 9 M8 11 L8 12" stroke="#000080" stroke-width="2" stroke-linecap="round" />
                </svg>
                <span>Error</span>
            </div>
            <button class="close-btn" onclick="closeWindow()">×</button>
        </div>
        <div class="dialog-content">
            <svg class="error-icon" viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="15" fill="#ff0000" />
                <circle cx="16" cy="16" r="13" fill="#fff" />
                <path d="M16 8 L16 18 M16 22 L16 24" stroke="#ff0000" stroke-width="3" stroke-linecap="round" />
            </svg>
            <div class="error-message">
                <strong>C:\</strong><br>
                Application not found
            </div>
        </div>
        <div class="button-container">
            <button class="ok-button" onclick="closeWindow()" autofocus>OK</button>
        </div>
    </div>

    <script>
        // Play error sound
        const errorSound = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBTGH0fPTgjMGHm7A7+OZUQ4NVKzn77BfGAc+ltryxnMlBSuAzvLZiTYIGGe77OmfTQwNUKfj8LdjHAY4kdfyzHksBSR3x/DdkEAKFF606+uoVRQKRp/g8r5sIQUxh9Hz04IzBh5uwO/jmVEODVSs5++wXxgHPpba8sZzJQUrgM7y2Yk2CBhnu+zpn00MDVCn4/C3YxwGOJHX8sx5LAUkd8fw3ZBACBRY');
        errorSound.play().catch(() => {
            // Fallback if audio doesn't play
            console.log('Error sound could not be played');
        });

        function closeWindow() {
            // Try to close the window
            window.close();

            // If window.close() doesn't work (parent window), hide the dialog
            document.querySelector('.error-dialog').style.display = 'none';
            document.body.innerHTML = '<div style="text-align:center;padding:50px;font-family:Tahoma;">Window closed. You can close this tab.</div>';
        }

        // Allow Enter key to close
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === 'Escape') {
                closeWindow();
            }
        });
    </script>
</body>

</html>
