<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doom</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #dosbox {
            width: 640px;
            height: 400px;
            background: #000;
        }
    </style>
    <script src="https://js-dos.com/cdn/js-dos-api.js"></script>
</head>

<body>
    <div id="dosbox"></div>
    <script>
        window.onload = function () {
            if (window.Dosbox) {
                var dosbox = new Dosbox({
                    id: 'dosbox',
                    onload: function (dosbox) {
                        // Path to the ZIP file relative to this HTML file
                        // This HTML is in static/apps/doom/index.html
                        // The game is in static/game/DOOM-@evilution.zip
                        // So path is ../../game/DOOM-@evilution.zip
                        dosbox.run('../../game/DOOM-@evilution.zip', './DOOM/DOOM.EXE');
                    },
                    onrun: function (dosbox, app) {
                        console.log("App '" + app + "' is running");
                    }
                });
            } else {
                console.error('Dosbox is not defined');
                document.getElementById('dosbox').innerHTML = '<div style="color:white; padding:20px;">Error: Dosbox failed to load.</div>';
            }
        };
    </script>
</body>

</html>
