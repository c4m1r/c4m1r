<div style="padding: 10px; height: 100%; display: flex; flex-direction: column;">
    <div style="flex: 1;">
        <fieldset>
            <legend>Themes</legend>
            <div style="margin-bottom: 10px;">
                <label>Theme:</label>
                <select id="theme-select" onchange="window.System.setTheme(this.value)">
                    <option value="xp">Windows XP</option>
                    <option value="98">Windows 98</option>
                    <button>Apply</button>
            </div>
    </div>
