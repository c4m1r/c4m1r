<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minesweeper</title>
    <style>
        body {
            background-color: #c0c0c0;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        .window-outer {
            padding: 6px;
            background: #c0c0c0;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 6px;
            margin-bottom: 6px;
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
        }

        .counter {
            background: black;
            color: red;
            font-family: 'Courier New', Courier, monospace;
            font-size: 24px;
            font-weight: bold;
            padding: 0 2px;
            border-top: 1px solid #808080;
            border-left: 1px solid #808080;
            border-right: 1px solid #fff;
            border-bottom: 1px solid #fff;
            display: flex;
        }

        .counter img {
            height: 23px;
        }

        .smiley-btn {
            width: 26px;
            height: 26px;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
            background: #c0c0c0;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .smiley-btn:active {
            border-top: 2px solid #808080;
            border-left: 2px solid #808080;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
        }

        .smiley-btn img {
            width: 20px;
            height: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(9, 16px);
            grid-template-rows: repeat(9, 16px);
            border-top: 3px solid #808080;
            border-left: 3px solid #808080;
            border-right: 3px solid #fff;
            border-bottom: 3px solid #fff;
        }

        .cell {
            width: 16px;
            height: 16px;
            background: #c0c0c0;
            border-top: 2px solid #fff;
            border-left: 2px solid #fff;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cell.pressed,
        .cell.uncovered {
            border: 1px solid #808080;
            /* Simplified for uncovered look */
            border: none;
            border-top: 1px solid #808080;
            border-left: 1px solid #808080;
            padding: 0;
        }

        .cell img {
            width: 16px;
            height: 16px;
            display: block;
        }
    </style>
</head>

<body>
    <div class="window-outer">
        <div class="header">
            <div class="counter" id="mines-counter">
                <img src="../../images/icons/minesweeper/digit0.webp">
                <img src="../../images/icons/minesweeper/digit1.webp">
                <img src="../../images/icons/minesweeper/digit0.webp">
            </div>
            <div class="smiley-btn" onclick="resetGame()">
                <img src="../../images/icons/minesweeper/smile.webp" id="smiley">
            </div>
            <div class="counter" id="timer-counter">
                <img src="../../images/icons/minesweeper/digit0.webp">
                <img src="../../images/icons/minesweeper/digit0.webp">
                <img src="../../images/icons/minesweeper/digit0.webp">
            </div>
        </div>
        <div class="grid" id="grid"></div>
    </div>

    <script>
        const rows = 9;
        const cols = 9;
        const totalMines = 10;
        let minesLeft = totalMines;
        let timer = 0;
        let timerInterval = null;
        let gameRunning = false;
        let cells = [];
        let firstClick = true;

        const gridEl = document.getElementById('grid');
        const minesCounterEl = document.getElementById('mines-counter');
        const timerCounterEl = document.getElementById('timer-counter');
        const smileyEl = document.getElementById('smiley');

        function initGame() {
            gridEl.innerHTML = '';
            cells = [];
            for (let i = 0; i < rows * cols; i++) {
                const cell = {
                    index: i,
                    mine: false,
                    uncovered: false,
                    flagged: false,
                    questioned: false,
                    neighborMines: 0,
                    el: document.createElement('div')
                };
                cell.el.className = 'cell';
                cell.el.dataset.index = i;
                cell.el.onmousedown = (e) => handleMouseDown(e, i);
                cell.el.onmouseup = (e) => handleMouseUp(e, i);
                cell.el.oncontextmenu = (e) => { e.preventDefault(); handleRightClick(i); };

                gridEl.appendChild(cell.el);
                cells.push(cell);
            }

            minesLeft = totalMines;
            updateCounter(minesCounterEl, minesLeft);
            resetTimer();
            smileyEl.src = '../../images/icons/minesweeper/smile.webp';
            firstClick = true;
            gameRunning = false;
        }

        function startGame(startIndex) {
            gameRunning = true;
            startTimer();

            // Place mines
            let minesPlaced = 0;
            while (minesPlaced < totalMines) {
                const idx = Math.floor(Math.random() * rows * cols);
                if (idx !== startIndex && !cells[idx].mine) {
                    cells[idx].mine = true;
                    minesPlaced++;
                }
            }

            // Calculate neighbors
            cells.forEach(cell => {
                if (!cell.mine) {
                    const neighbors = getNeighbors(cell.index);
                    cell.neighborMines = neighbors.reduce((acc, idx) => acc + (cells[idx].mine ? 1 : 0), 0);
                }
            });
        }

        function getNeighbors(index) {
            const neighbors = [];
            const row = Math.floor(index / cols);
            const col = index % cols;

            for (let r = row - 1; r <= row + 1; r++) {
                for (let c = col - 1; c <= col + 1; c++) {
                    if (r >= 0 && r < rows && c >= 0 && c < cols && (r !== row || c !== col)) {
                        neighbors.push(r * cols + c);
                    }
                }
            }
            return neighbors;
        }

        function handleMouseDown(e, index) {
            if (e.button === 0 && smileyEl.src.includes('smile')) {
                smileyEl.src = '../../images/icons/minesweeper/surprise.webp';
            }
        }

        function handleMouseUp(e, index) {
            if (e.button === 0) {
                if (smileyEl.src.includes('surprise')) {
                    smileyEl.src = '../../images/icons/minesweeper/smile.webp';
                }
                uncoverCell(index);
            }
        }

        function uncoverCell(index) {
            const cell = cells[index];
            if (cell.uncovered || cell.flagged || cell.questioned) return;

            if (firstClick) {
                startGame(index);
                firstClick = false;
            }

            cell.uncovered = true;
            cell.el.classList.add('uncovered');

            if (cell.mine) {
                gameOver(false, index);
            } else {
                if (cell.neighborMines === 0) {
                    cell.el.innerHTML = `<img src="../../images/icons/minesweeper/open0.webp">`;
                    const neighbors = getNeighbors(index);
                    neighbors.forEach(uncoverCell);
                } else {
                    cell.el.innerHTML = `<img src="../../images/icons/minesweeper/open${cell.neighborMines}.webp">`;
                }

                if (checkWin()) {
                    gameOver(true);
                }
            }
        }

        function handleRightClick(index) {
            if (!gameRunning && !firstClick) return;
            const cell = cells[index];
            if (cell.uncovered) return;

            if (!cell.flagged && !cell.questioned) {
                cell.flagged = true;
                cell.el.innerHTML = `<img src="../../images/icons/minesweeper/flag.webp">`;
                minesLeft--;
            } else if (cell.flagged) {
                cell.flagged = false;
                cell.questioned = true;
                cell.el.innerHTML = `<img src="../../images/icons/minesweeper/question.webp">`;
                minesLeft++;
            } else {
                cell.questioned = false;
                cell.el.innerHTML = '';
            }
            updateCounter(minesCounterEl, minesLeft);
        }

        function checkWin() {
            return cells.every(cell => (cell.mine && !cell.uncovered) || (!cell.mine && cell.uncovered));
        }

        function gameOver(won, clickedMineIndex) {
            gameRunning = false;
            clearInterval(timerInterval);
            smileyEl.src = won ? '../../images/icons/minesweeper/win.webp' : '../../images/icons/minesweeper/dead.webp';

            cells.forEach((cell, idx) => {
                if (cell.mine) {
                    if (won) {
                        cell.el.innerHTML = `<img src="../../images/icons/minesweeper/flag.webp">`;
                    } else {
                        if (idx === clickedMineIndex) {
                            cell.el.innerHTML = `<img src="../../images/icons/minesweeper/mine-death.webp">`;
                        } else {
                            cell.el.innerHTML = `<img src="../../images/icons/minesweeper/mine-ceil.webp">`;
                        }
                    }
                }
            });
        }

        function updateCounter(el, num) {
            num = Math.max(-99, Math.min(999, num));
            const str = Math.abs(num).toString().padStart(3, '0');
            const digits = str.split('');
            if (num < 0) digits[0] = '-'; // Handle negative? Logic in Vue was simpler

            // Actually, let's just map digits to images
            // Vue logic: hundreds, tens, units
            let hundreds = Math.floor(num / 100);
            let tens = Math.floor((num % 100) / 10);
            let units = num % 10;

            if (num < 0) {
                // simplified negative handling
                hundreds = 0; tens = 0; units = 0;
            }

            el.innerHTML = `
                <img src="../../images/icons/minesweeper/digit${hundreds}.webp">
                <img src="../../images/icons/minesweeper/digit${tens}.webp">
                <img src="../../images/icons/minesweeper/digit${units}.webp">
            `;
        }

        function startTimer() {
            timer = 0;
            updateCounter(timerCounterEl, timer);
            timerInterval = setInterval(() => {
                timer++;
                if (timer > 999) timer = 999;
                updateCounter(timerCounterEl, timer);
            }, 1000);
        }

        function resetTimer() {
            clearInterval(timerInterval);
            timer = 0;
            updateCounter(timerCounterEl, timer);
        }

        function resetGame() {
            initGame();
        }

        initGame();
    </script>
</body>

</html>
