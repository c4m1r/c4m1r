<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows XP Desktop</title>
    <link rel="stylesheet" href="./css/style.css?v=6">
    <link rel="icon" href="./images/windowsIcons/290.ico?v=6">
</head>
<body>
    <!-- Desktop Background -->
    <div id="desktop" class="desktop">
        <!-- Desktop Icons -->
        <div id="desktop-icons" class="desktop-icons">
            <div class="desktop-icon" data-app="internet-explorer">
                <div class="desktop-icon-img-container">
                    <img src="./images/windowsIcons/ie.png" alt="Internet Explorer">
                </div>
                <div class="desktop-icon-text-container">
                    <span>The Chrome Explorer</span>
                </div>
            </div>
            <div class="desktop-icon" data-app="minesweeper">
                <div class="desktop-icon-img-container">
                    <img src="./apps/minesweeper/mine-icon.png" alt="Minesweeper">
                </div>
                <div class="desktop-icon-text-container">
                    <span>Minesweeper</span>
                </div>
            </div>
            <div class="desktop-icon" data-app="my-computer">
                <div class="desktop-icon-img-container">
                    <img src="./images/windowsIcons/676(32x32).png" alt="My Computer">
                </div>
                <div class="desktop-icon-text-container">
                    <span>Abstract Computer</span>
                </div>
            </div>
            <div class="desktop-icon" data-app="notepad">
                <div class="desktop-icon-img-container">
                    <img src="./images/windowsIcons/327(32x32).png" alt="Notepad">
                </div>
                <div class="desktop-icon-text-container">
                    <span>Notepad</span>
                </div>
            </div>
            <div class="desktop-icon" data-app="winamp">
                <div class="desktop-icon-img-container">
                    <img src="./images/windowsIcons/winamp.png" alt="Winamp">
                </div>
                <div class="desktop-icon-text-container">
                    <span>Winamp</span>
                </div>
            </div>
            <div class="desktop-icon" data-app="paint">
                <div class="desktop-icon-img-container">
                    <img src="./images/windowsIcons/680(32x32).png" alt="Paint">
                </div>
                <div class="desktop-icon-text-container">
                    <span>Paint</span>
                </div>
            </div>
            <div class="desktop-icon" data-app="calculator">
                <div class="desktop-icon-img-container">
                    <img src="./images/windowsIcons/300(16x16).png" alt="Calculator">
                </div>
                <div class="desktop-icon-text-container">
                    <span>Calculator</span>
                </div>
            </div>
        </div>

        <!-- Selection Rectangle -->
        <div id="selection-rect" class="selection-rect"></div>

        <!-- Windows Container -->
        <div id="windows-container" class="windows-container"></div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar" class="taskbar">
        <!-- Start Button -->
        <div id="start-button" class="start-button">
            <img src="./images/windowsIcons/start.png" alt="Start">
            <span>start</span>
        </div>

        <!-- Taskbar Apps -->
        <div id="taskbar-apps" class="taskbar-apps"></div>

        <!-- System Tray -->
        <div id="system-tray" class="system-tray">
            <div id="volume-icon" class="system-tray-icon">
                <img src="./images/windowsIcons/volume.svg" alt="Volume" class="volume-icon">
            </div>
            <span id="clock">12:00 PM</span>
        </div>
    </div>

    <!-- Calendar Popup -->
    <div id="calendar-popup" class="calendar-popup hidden">
        <div class="calendar-header">
            <div class="calendar-month-year">January 2024</div>
            <div class="calendar-nav">
                <button id="prev-month">&lt;</button>
                <button id="next-month">&gt;</button>
            </div>
        </div>
        <div class="calendar-grid">
            <div class="calendar-day-header">Su</div>
            <div class="calendar-day-header">Mo</div>
            <div class="calendar-day-header">Tu</div>
            <div class="calendar-day-header">We</div>
            <div class="calendar-day-header">Th</div>
            <div class="calendar-day-header">Fr</div>
            <div class="calendar-day-header">Sa</div>
            <!-- Days will be populated by JavaScript -->
        </div>
        <div class="calendar-time">
            <div id="calendar-time-display">12:00:00 PM</div>
        </div>
    </div>

    <!-- Volume Popup -->
    <div id="volume-popup" class="volume-popup hidden">
        <div class="volume-header">
            <img src="./images/windowsIcons/speaker.svg" alt="Speaker" class="volume-speaker-icon">
            <span>Masters Volume</span>
        </div>
        <div class="volume-slider-container">
            <input type="range" id="volume-slider" min="0" max="100" value="50" class="volume-slider">
            <div class="volume-level">50</div>
        </div>
        <div class="volume-mute">
            <label>
                <input type="checkbox" id="mute-checkbox">
                Mute
            </label>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" class="start-menu hidden">
        <div class="start-menu-header">
            <div class="start-menu-logo">
                <img src="./images/windowsIcons/windows.png" alt="Windows">
            </div>
            <div class="start-menu-title">
                <span class="start-menu-title-main">Windows</span>
                <span class="start-menu-title-xp">XP</span>
            </div>
        </div>
        <div class="start-menu-content">
            <div class="start-menu-left">
                <div id="start-menu-programs" class="start-menu-section"></div>
            </div>
            <div class="start-menu-right">
                <div id="start-menu-places" class="start-menu-section"></div>
            </div>
        </div>
        <div class="start-menu-bottom">
            <div class="start-menu-user">
                <img src="./images/windowsIcons/user.png" alt="User" class="user-icon">
                <span class="user-name">Administrator</span>
            </div>
            <div class="start-menu-bottom-buttons">
                <div class="start-menu-item" id="log-off">
                    <img src="./images/windowsIcons/318(16x16).png" alt="">
                    <span>Log Off</span>
                </div>
                <div class="start-menu-item" id="turn-off">
                    <img src="./images/windowsIcons/windows-off.png" alt="">
                    <span>Turn Off Computer</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Power Off Modal -->
    <div id="power-modal" class="power-modal hidden">
        <div class="power-modal-content">
            <div class="power-modal-header">
                <h2 id="power-modal-title">Turn off computer</h2>
            </div>
            <div class="power-modal-body">
                <p id="power-modal-message">Are you sure you want to turn off your computer?</p>
            </div>
            <div class="power-modal-buttons">
                <button id="power-yes">Yes</button>
                <button id="power-no">No</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/webamp@1.4.0/built/webamp.bundle.min.js"></script>
    <script src="./js/winamp-tracks.js?v=6"></script>
    <script src="./js/desktop.js?v=6"></script>
    <script src="./js/window.js?v=6"></script>
    <script src="./js/original-apps.js?v=6"></script>
    <script src="./js/apps.js?v=6"></script>
</body>
</html>
