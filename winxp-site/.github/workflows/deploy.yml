name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Rust
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable

    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Build Rust project
      run: cargo build --release

    - name: Create static build
      run: |
        mkdir -p dist
        cp -r static/* dist/
        cp target/release/winxp-site dist/ 2>/dev/null || echo "Binary not copied (expected for cross-platform)"

    - name: Create simple static server
      run: |
        cat > dist/index.html << 'EOF'
        <!DOCTYPE html>
        <html>
        <head>
            <title>Windows XP Desktop</title>
            <meta charset="utf-8">
            <style>
                body {
                    font-family: Arial, sans-serif;
                    text-align: center;
                    padding: 50px;
                    background: linear-gradient(45deg, #008080, #004080);
                    color: white;
                }
                .container {
                    max-width: 800px;
                    margin: 0 auto;
                    background: rgba(255, 255, 255, 0.1);
                    padding: 30px;
                    border-radius: 10px;
                }
                h1 { font-size: 3em; margin-bottom: 20px; }
                p { font-size: 1.2em; margin: 20px 0; }
                .button {
                    display: inline-block;
                    padding: 15px 30px;
                    background: #0078d4;
                    color: white;
                    text-decoration: none;
                    border-radius: 5px;
                    margin: 10px;
                    transition: background 0.3s;
                }
                .button:hover { background: #005a9e; }
            </style>
        </head>
        <body>
            <div class="container">
                <h1>🖥️ Windows XP Desktop</h1>
                <p>Веб-приложение, имитирующее интерфейс Windows XP</p>
                <p>🚀 <strong>Для локального запуска:</strong></p>
                <p>1. Установите Rust: <a href="https://rustup.rs/" class="button">rustup.rs</a></p>
                <p>2. Клонируйте репозиторий</p>
                <p>3. Запустите: <code>cargo run</code></p>
                <p>4. Откройте: <code>http://localhost:3000</code></p>
                <br>
                <a href="https://github.com/c4m1r/winxp-site" class="button">📁 Исходный код на GitHub</a>
            </div>
        </body>
        </html>
        EOF

    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./dist
        cname: c4m1r.github.io
