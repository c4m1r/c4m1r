name: Generate GitHub Metrics

on:
  # Schedule updates every 6 hours
  schedule:
    - cron: "0 */6 * * *"
  # Allow manual workflow trigger
  workflow_dispatch:

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    if: github.repository == 'c4m1r/c4m1r'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate isocalendar.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: c4m1r
          template: classic
          filename: isocalendar.svg
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          output_action: commit

      - name: Generate languages.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: c4m1r
          template: classic
          filename: languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 8
          output_action: commit

      - name: Generate licenses.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: c4m1r
          template: classic
          filename: licenses.svg
          base: ""
          plugin_licenses: yes
          plugin_licenses_legal: yes
          plugin_licenses_ratio: yes
          output_action: commit

      - name: Generate followup.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: c4m1r
          template: classic
          filename: followup.svg
          base: ""
          plugin_followup: yes
          plugin_followup_sections: repositories
          output_action: commit

      - name: Generate calendar.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: c4m1r
          template: classic
          filename: calendar.svg
          base: ""
          plugin_calendar: yes
          plugin_calendar_limit: 0
          output_action: commit

      - name: Generate notable.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: c4m1r
          template: classic
          filename: notable.svg
          base: ""
          plugin_notable: yes
          plugin_notable_from: all
          output_action: commit

      - name: Generate traffic.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: c4m1r
          template: classic
          filename: traffic.svg
          base: ""
          plugin_traffic: yes
          output_action: commit

      - name: Generate pagespeed.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: c4m1r
          template: classic
          filename: pagespeed.svg
          base: ""
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://c4m1r.github.io
          output_action: commit

      - name: Generate anilist.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ github.token }}
          user: c4m1r
          template: classic
          filename: anilist.svg
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: an0n72
          plugin_anilist_sections: favorites
          output_action: commit
