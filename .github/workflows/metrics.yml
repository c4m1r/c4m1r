name: Generate GitHub Metrics

on:
  # Schedule daily updates at midnight UTC
  schedule:
    - cron: "0 0 * * *"
  # Allow manual workflow trigger
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate general metrics
        uses: c4m1r/c4m1r@main
        with:
          # GitHub token with 'repo' scope for private repositories access
          token: ${{ secrets.repo_c4m1r_metrics }}
          user: c4m1r
          template: classic
          filename: general.svg
          base: header, activity, community, repositories, metadata
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_stargazers: yes
          plugin_stargazers_charts_type: classic
          plugin_lines: yes
          plugin_lines_sections: repositories, recent
          repositories: 100
          repositories_forks: no
          # Include private repositories (requires 'repo' scope in token)
          repositories_affiliations: owner, collaborator

      - name: Generate medias metrics
        uses: c4m1r/c4m1r@main
        with:
          token: ${{ secrets.repo_c4m1r_metrics }}
          user: c4m1r
          template: classic
          filename: medias.svg
          base: ""
          plugin_languages: yes
          plugin_languages_limit: 10
          plugin_languages_sections: recently-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_stargazers: yes
          plugin_stargazers_charts_type: graph
          plugin_habits: yes
          plugin_habits_sections: charts, facts
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          repositories: 100
          repositories_forks: no
          repositories_affiliations: owner, collaborator

      - name: Generate sponsors metrics
        uses: c4m1r/c4m1r@main
        with:
          token: ${{ secrets.repo_c4m1r_metrics }}
          user: c4m1r
          template: classic
          filename: sponsors.svg
          base: ""
          plugin_sponsors: yes
          plugin_sponsors_sections: goal, list, about
          plugin_sponsors_size: 24

      - name: Generate achievements metrics
        uses: c4m1r/c4m1r@main
        with:
          token: ${{ secrets.repo_c4m1r_metrics }}
          user: c4m1r
          template: classic
          filename: achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_limit: 0

      - name: Generate placeholder
        uses: c4m1r/c4m1r@main
        with:
          token: ${{ secrets.repo_c4m1r_metrics }}
          user: c4m1r
          template: classic
          filename: placeholder.svg
          base: metadata
          config_display: columns

