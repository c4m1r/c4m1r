name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-metrics:
    if: github.repository == 'c4m1r/c4m1r'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate isocalendar.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: c4m1r
          template: classic
          base: ""
          filename: isocalendar.svg
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Generate languages.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: c4m1r
          template: classic
          base: ""
          filename: languages.svg
          plugin_languages: yes
          plugin_languages_limit: 8

      - name: Generate licenses.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: c4m1r
          template: classic
          base: ""
          filename: licenses.svg
          plugin_licenses: yes
          plugin_licenses_legal: yes
          plugin_licenses_ratio: yes

      - name: Generate followup.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: c4m1r
          template: classic
          base: ""
          filename: followup.svg
          plugin_followup: yes
          plugin_followup_sections: repositories

      - name: Generate calendar.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: c4m1r
          template: classic
          base: ""
          filename: calendar.svg
          plugin_calendar: yes
          plugin_calendar_limit: 0

      - name: Generate notable.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: c4m1r
          template: classic
          base: ""
          filename: notable.svg
          plugin_notable: yes
          plugin_notable_from: all

      - name: Generate traffic.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: c4m1r
          template: classic
          base: ""
          filename: traffic.svg
          plugin_traffic: yes

      - name: Generate pagespeed.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: c4m1r
          template: classic
          base: ""
          filename: pagespeed.svg
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://c4m1r.github.io

      - name: Generate anilist.svg
        uses: ./
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: c4m1r
          template: classic
          base: ""
          filename: anilist.svg
          plugin_anilist: yes
          plugin_anilist_user: an0n72

      - name: Commit and push generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add isocalendar.svg languages.svg licenses.svg followup.svg calendar.svg notable.svg traffic.svg pagespeed.svg anilist.svg
          if git diff --cached --quiet; then
            echo "No SVG changes to commit."
            exit 0
          fi
          git commit -m "chore: update metrics"
          git push
